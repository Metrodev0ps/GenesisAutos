name: Validate Genesis Autos integration

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/**"
      - "supabase/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/validate-build.yml"
  pull_request:
    paths:
      - "src/**"
      - "scripts/**"
      - "supabase/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/validate-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Build production bundle
        run: npm run build
      - name: Validate import without writing
        run: npm run import:genesis-catalogue -- --dry-run
